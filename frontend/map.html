<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Map | SafetyFirst</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="css/style.css">
    <style>
        #map {
            height: calc(100vh - 72px); /* Full height minus navbar */
            width: 100%;
            margin-top: 72px;
        }

        .map-legend {
            position: absolute;
            bottom: 30px;
            left: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: var(--radius-md);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .map-filters {
            position: absolute;
            top: 92px;
            right: 20px;
            z-index: 1000;
            width: 250px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            display: inline-block;
            border-radius: 50%;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <!-- Navbar Wrapper -->
    <nav id="mainNavbar"></nav>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Map Legend -->
    <div class="map-legend">
        <h6 class="fw-bold mb-3">Crime Risk Levels</h6>
        <div class="legend-item">
            <span class="legend-color" style="background: var(--danger-red);"></span>
            <span>High Risk (Active Area)</span>
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: var(--warning-amber);"></span>
            <span>Medium Risk (Caution)</span>
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: var(--success-green);"></span>
            <span>Low Risk (Secure)</span>
        </div>
        <hr class="my-2">
        <div class="small text-muted">Data updated: Real-time</div>
    </div>

    <!-- Map Filters -->
    <div class="map-filters d-none d-md-block">
        <div class="card border-0 shadow-lg p-3">
            <h6 class="fw-bold mb-3"><i class="bi bi-funnel me-1"></i> Filter Map</h6>
            <div class="mb-3">
                <label class="form-label small">Incident Category</label>
                <select class="form-select form-select-sm">
                    <option>All Types</option>
                    <option>Theft</option>
                    <option>Assault</option>
                    <option>Cybercrime</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label small">Time Period</label>
                <select class="form-select form-select-sm">
                    <option>Last 24 Hours</option>
                    <option>Last 7 Days</option>
                    <option>Last 30 Days</option>
                </select>
            </div>
            <div class="d-grid">
                <button class="btn btn-primary-custom btn-sm">Apply Filters</button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize the map (Centered at Hyderabad)
            const map = L.map('map').setView([17.3850, 78.4867], 12);

            // Add OpenStreetMap tiles
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            const colors = {
                'High': '#ff4d4d',
                'Medium': '#ffbe0b',
                'Low': '#06d6a0'
            };

            // Fetch live hotspots from backend
            async function fetchHotspots() {
                try {
                    const response = await fetch('/api/reports/map-stats');
                    const result = await response.json();
                    
                    if (result.success) {
                        renderMarkers(result.data);
                    }
                } catch (err) {
                    console.error("Map data fetch error:", err);
                }
            }

            function renderMarkers(hotspots) {
                hotspots.forEach(spot => {
                    const marker = L.circleMarker([spot.lat, spot.lng], {
                        radius: 12 + (spot.count * 2), // Size grows with incident count
                        fillColor: colors[spot.risk],
                        color: '#fff',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(map);

                    marker.bindPopup(`
                        <div class="p-2">
                            <strong class="d-block mb-1">${spot.location}</strong>
                            <span class="badge bg-light text-dark border mb-2">
                                <span class="status-dot" style="background:${colors[spot.risk]}"></span> ${spot.risk} Risk
                            </span>
                            <div class="small text-muted">Total Incidents: <strong>${spot.count}</strong></div>
                            <div class="small text-muted mt-1">Last seen: ${new Date(spot.lastReport).toLocaleDateString()}</div>
                            <a href="dashboard.html" class="btn btn-link btn-sm p-0 mt-2">View Personal Stats →</a>
                        </div>
                    `);
                });
            }

            fetchHotspots();
        });
    </script>
</body>
</html>
